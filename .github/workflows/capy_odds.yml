name: Capy Odds — live snapshot (hkjc-api GraphQL)

# Live odds + pool-total snapshot scraper using the hkjc-api npm GraphQL
# wrapper. Appends one time-series row per (race, pool, combination,
# snapshot_at) to local sqlite, then pushes the odds delta to Cloudflare D1.
#
# Schedule: every 10 min during HK racing betting window (roughly
# 09:00–23:00 HKT). HKJC publishes odds starting ~3 days out for reserves
# and liquid pools lock at race start. Snapshot frequency chosen to balance
# D1 row growth vs OHLC granularity (10 min ≈ 144 snapshots/day × ~8 races
# × ~14 horses × 6 pools ≈ 100k rows/race-day, acceptable).

on:
  workflow_dispatch:
    inputs:
      pools:
        description: 'Comma-separated pool types (WIN,PLA,QIN,QPL,FCT,TRI,FF,...). Blank = defaults.'
        required: false
        default: ''
      since:
        description: 'D1 push lookback YYYY-MM-DD (blank = today HKT)'
        required: false
        default: ''
  schedule:
    # Every 10 minutes. Fixture guard + no-meeting short-circuit inside the
    # job makes this cheap when there is no active meeting.
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: capy-odds
  cancel-in-progress: false

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  snapshot-odds:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 10
    steps:
      - name: Checkout tianxi-backend (scraper + push scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (hkjc-api + better-sqlite3)
        # `npm install` (not ci) because package-lock.json may lag behind
        # the package.json hkjc-api entry between pushes. Acceptable here
        # since this is a short-lived runner, not a reproducible build.
        run: npm install --no-audit --no-fund

      - name: Ensure odds schema exists in local scratch db
        run: |
          set -eu
          rm -f bulk-local.db
          # Apply only the odds schema — other tables are not needed for odds-only push.
          node -e "
            const Database = require('better-sqlite3');
            const fs = require('fs');
            const db = new Database('bulk-local.db');
            db.exec(fs.readFileSync('src/db/schema_odds.sql', 'utf8'));
            console.log('odds schema applied to bulk-local.db');
          "

      - name: Scrape current-meeting odds
        id: scrape
        env:
          POOLS: ${{ github.event.inputs.pools }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          POOLS_ARG=""
          if [ -n "$POOLS" ]; then POOLS_ARG="--pools=$POOLS"; fi
          set +e
          npx tsx scripts/scrape-odds.ts --db=bulk-local.db $POOLS_ARG > /tmp/scrape.json 2> /tmp/scrape.err
          RC=$?
          set -e
          cat /tmp/scrape.err || true
          if [ "$RC" -ne 0 ]; then
            echo "::warning::scrape-odds exited $RC — likely no active meeting; skipping push"
            echo "has_data=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          ROWS=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/scrape.json','utf8'));console.log((j.oddsRowsWritten||0)+(j.poolTotalRowsWritten||0));}catch(e){console.log(0);}")
          echo "rows=$ROWS" >> $GITHUB_OUTPUT
          if [ "$ROWS" = "0" ]; then
            echo "has_data=false" >> $GITHUB_OUTPUT
          else
            echo "has_data=true" >> $GITHUB_OUTPUT
          fi
          cat /tmp/scrape.json || true

      - name: Resolve --since
        if: steps.scrape.outputs.has_data == 'true'
        id: resolve
        run: |
          set -eu
          S="${{ github.event.inputs.since }}"
          if [ -z "$S" ]; then
            # Default: today HK. Cron fires every 10 min including post-midnight HK
            # (e.g. 16:08 UTC = 00:08 HKT next day) when bulk-local.db only has
            # data for "yesterday HK". Always include yesterday HK as well so
            # post-midnight runs still push the just-finished race day's odds.
            T=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
            Y=$(TZ=Asia/Hong_Kong date -d "yesterday" +%Y-%m-%d)
            # Use yesterday as SINCE — captures both yesterday + today, slightly
            # wider window is harmless (push-delta filters by snapshot timestamp).
            S="$Y"
          fi
          echo "since=$S" >> $GITHUB_OUTPUT

      - name: Generate odds delta chunks
        if: steps.scrape.outputs.has_data == 'true'
        env:
          SINCE: ${{ steps.resolve.outputs.since }}
        run: |
          set -eu
          rm -rf /tmp/d1-delta
          npx tsx scripts/push-delta.ts \
            --db=bulk-local.db \
            --since="$SINCE" \
            --include=odds \
            --out=/tmp/d1-delta
          ls -la /tmp/d1-delta/ | head -20 || echo "(no chunks)"

      - name: Install wrangler
        if: steps.scrape.outputs.has_data == 'true'
        run: npm install -g wrangler@4

      - name: Push odds delta to D1 (retry + verify landed rows)
        # wrangler `d1 execute --file` sometimes reports "Not currently importing
        # anything" / overloaded after the import already finished or before it
        # started. Rows use stable PK ids (ON CONFLICT upsert), so retrying a chunk
        # never duplicates. Success is decided by counting this run's snapshot rows
        # in D1, not by wrangler's polling message.
        if: steps.scrape.outputs.has_data == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          for t in odds_snapshots pool_totals; do
            for f in /tmp/d1-delta/${t}-*.sql; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              ok=0
              for attempt in 1 2 3 4 5; do
                if wrangler d1 execute tianxi-db --remote --yes --file="$f" >/tmp/out.log 2>&1; then
                  echo "OK  $base (attempt $attempt)"; ok=1; break
                fi
                echo "RETRY $base attempt $attempt: $(grep -m1 -iE 'error|not currently|overload' /tmp/out.log || tail -1 /tmp/out.log)"
                sleep $((attempt * 8))
              done
              [ "$ok" -eq 1 ] || echo "::warning::$base 未確認，最後以D1行數核對"
            done
          done

          # Verify: every local row of this snapshot must exist in D1.
          check() {
            local table=$1
            local snaps expected remote
            snaps=$(node -e "const D=require('better-sqlite3');const d=new D('bulk-local.db');console.log(d.prepare('SELECT DISTINCT snapshot_at s FROM $table').all().map(r=>\"'\"+r.s+\"'\").join(','))")
            [ -n "$snaps" ] || { echo "$table: no local rows"; return 0; }
            expected=$(node -e "const D=require('better-sqlite3');const d=new D('bulk-local.db');console.log(d.prepare('SELECT COUNT(*) c FROM $table').get().c)")
            for attempt in 1 2 3 4; do
              remote=$(wrangler d1 execute tianxi-db --remote --json --command="SELECT COUNT(*) AS c FROM $table WHERE snapshot_at IN ($snaps)" 2>/dev/null \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)[0].results[0].c)}catch(e){console.log(-1)}})")
              echo "$table: local=$expected d1=$remote (check $attempt)"
              [ "$remote" -ge "$expected" ] 2>/dev/null && return 0
              sleep $((attempt * 10))
            done
            echo "::error::$table 只寫入 $remote / $expected 行"
            return 1
          }
          check odds_snapshots
          check pool_totals
