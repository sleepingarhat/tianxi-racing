name: ELO Post-Race Auto-Update

# Fires automatically after Capy Race Day commits new results CSVs.
# 1. Ingest HKJC CSVs (profiles + form) into scratch bulk-local.db
#    (using tianxi-backend/scripts/ingest — the .elo-pipeline duplicate
#    was removed in Cleanup Batch 4; canonical scripts live in backend repo)
# 2. Run ELO v12 compute → horse/jockey/trainer_elo_snapshots
# 3. Generate delta SQL chunks via push-delta.ts (include=elo)
# 4. Push chunks to Cloudflare D1 via wrangler d1 execute
#
# Also supports manual dispatch for backfill.

on:
  schedule:
    - cron: '13 17 * * *'   # 01:13 HK (after d1_sync 00:23 HK)
  workflow_run:
    workflows: ['Capy Race Day — RacingData Results']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Push ELO snapshots from (YYYY-MM-DD, blank = 14d back)'
        required: false
        type: string
      force_full_recompute:
        description: 'Full recompute + push from 2016'
        required: false
        default: 'false'
        type: choice
        options: [ 'false', 'true' ]

permissions:
  contents: read

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  elo-update:
    needs: season_gate
    if: >-
      needs.season_gate.outputs.skip != 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tianxi-database (CSV source)
        uses: actions/checkout@v4
        with:
          path: tianxi-database
          fetch-depth: 1

      - name: Link tianxi-backend → 統一倉 backend/
        working-directory: ${{ github.workspace }}
        run: mv "$GITHUB_WORKSPACE/tianxi-database/backend" "$GITHUB_WORKSPACE/tianxi-backend"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve --since window
        id: resolve
        run: |
          set -eu
          if [ "${{ inputs.force_full_recompute }}" = "true" ]; then
            echo "since=2016-01-01" >> $GITHUB_OUTPUT
            echo "mode=full" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.start_date }}" ]; then
            echo "since=${{ inputs.start_date }}" >> $GITHUB_OUTPUT
            echo "mode=since" >> $GITHUB_OUTPUT
          else
            S=$(TZ=Asia/Hong_Kong date -d "today -14 days" +%Y-%m-%d)
            echo "since=$S" >> $GITHUB_OUTPUT
            echo "mode=incremental" >> $GITHUB_OUTPUT
          fi

      - name: Install tianxi-backend deps (provides scripts + tsx + better-sqlite3)
        working-directory: tianxi-backend
        run: npm ci --no-audit --no-fund

      - name: Regression tests — restored v12 formulas and replay
        working-directory: tianxi-backend
        run: |
          npx tsx scripts/test-elo-v12.ts
          npx tsx scripts/test-elo-v12-integration.ts
          npx tsx scripts/test-elo-asof.ts

      - name: Ingest CSVs into bulk-local.db
        working-directory: tianxi-backend
        run: |
          npx tsx scripts/ingest/index.ts profiles form --data-dir=../tianxi-database --db=./bulk-local.db
          ls -la bulk-local.db

      - name: Run ELO v12 compute
        working-directory: tianxi-backend
        env:
          ELO_SINCE: ${{ steps.resolve.outputs.since }}
          ELO_MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          # Always reconstruct state from full history; SINCE limits publication only.
          npx tsx scripts/elo/compute_v12.ts --db=./bulk-local.db --reset

      - name: Verify ELO snapshots in bulk-local.db
        working-directory: tianxi-backend
        env:
          ELO_SINCE: ${{ steps.resolve.outputs.since }}
        run: |
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database('./bulk-local.db', { readonly: true });
            const since = process.env.ELO_SINCE;
            const form = db.prepare('SELECT COUNT(*) AS n, MIN(race_date) AS min_d, MAX(race_date) AS max_d FROM horse_form_records').get();
            const formRecent = db.prepare('SELECT COUNT(*) AS n, MAX(race_date) AS max_d FROM horse_form_records WHERE race_date >= ?').get(since);
            const hAll = db.prepare('SELECT COUNT(*) AS n, MAX(as_of_date) AS max_d FROM horse_elo_snapshots WHERE id LIKE \'v12:%\'').get();
            const jAll = db.prepare('SELECT COUNT(*) AS n, MAX(as_of_date) AS max_d FROM jockey_elo_snapshots WHERE id LIKE \'v12:%\'').get();
            const tAll = db.prepare('SELECT COUNT(*) AS n, MAX(as_of_date) AS max_d FROM trainer_elo_snapshots WHERE id LIKE \'v12:%\'').get();
            const hSince = db.prepare('SELECT COUNT(*) AS n FROM horse_elo_snapshots WHERE as_of_date >= ? AND id LIKE \'v12:%\'').get(since);
            console.log('form (source)     :', form);
            console.log('form since ' + since + ' :', formRecent);
            console.log('horse snapshots   :', hAll);
            console.log('jockey snapshots  :', jAll);
            console.log('trainer snapshots :', tAll);
            console.log('horse snaps since :', hSince);
            if (hAll.n === 0) {
              console.error('::error::No horse ELO snapshots in bulk-local.db at all - compute step is broken.');
              process.exit(1);
            }
            if (form.max_d && hAll.max_d && hAll.max_d < form.max_d) {
              console.error('::error::Horse snapshot integrity gap: snapshots reach ' + hAll.max_d + ' but form_records reach ' + form.max_d + '. compute_v12.ts is dropping recent races.');
              process.exit(1);
            }
            for (const [axis, snap] of [['jockey', jAll], ['trainer', tAll]]) {
              if (snap.n === 0) {
                console.error('::error::No ' + axis + ' ELO snapshots in bulk-local.db at all - investigate compute_v12 ' + axis + ' code path.'); process.exit(1);
              } else if (form.max_d && snap.max_d && snap.max_d < form.max_d) {
                console.error('::error::' + axis + ' snapshot lag: snapshots reach ' + snap.max_d + ' but horse_form_records reach ' + form.max_d + ' '); process.exit(1);
              }
            }
            if (hSince.n === 0) {
              console.log('::warning::No horse ELO snapshots updated since ' + since + ' - horse_form ingest is lagging behind results CSV.');
            }
          "

      - name: Generate ELO delta SQL chunks
        working-directory: tianxi-backend
        env:
          SINCE: ${{ steps.resolve.outputs.since }}
        run: |
          set -eu
          rm -rf /tmp/d1-delta
          npx tsx scripts/push-delta.ts \
            --db=./bulk-local.db \
            --since="$SINCE" \
            --include=elo \
            --elo-version=v12 \
            --out=/tmp/d1-delta
          ls -la /tmp/d1-delta/ | head -40 || echo "(no chunks)"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Push ELO delta to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: tianxi-backend
        run: |
          set -eu
          ORDER=(horses jockeys trainers horse_elo_snapshots jockey_elo_snapshots trainer_elo_snapshots)
          FAILED=0
          for t in "${ORDER[@]}"; do
            for f in /tmp/d1-delta/${t}-*.sql; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if wrangler d1 execute tianxi-db --remote --file="$f" >/tmp/out.log 2>&1; then
                echo "OK  $base"
              else
                echo "FAIL $base"
                tail -20 /tmp/out.log
                FAILED=1
              fi
            done
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Verify D1 v12 snapshots post-push
        working-directory: tianxi-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ELO_SINCE: ${{ steps.resolve.outputs.since }}
        run: |
          set -eu
          npx wrangler d1 execute tianxi-db --remote --command="SELECT 'horse' AS axis, COUNT(*) AS n, MAX(as_of_date) AS latest FROM horse_elo_snapshots WHERE id LIKE 'v12:%' AND as_of_date >= '$ELO_SINCE' UNION ALL SELECT 'jockey', COUNT(*), MAX(as_of_date) FROM jockey_elo_snapshots WHERE id LIKE 'v12:%' AND as_of_date >= '$ELO_SINCE' UNION ALL SELECT 'trainer', COUNT(*), MAX(as_of_date) FROM trainer_elo_snapshots WHERE id LIKE 'v12:%' AND as_of_date >= '$ELO_SINCE'" --json > /tmp/elo-remote.json
          python3 - <<'PY'
          import json, sqlite3, os
          db = sqlite3.connect('bulk-local.db')
          rows = json.load(open('/tmp/elo-remote.json'))[0]['results']
          for row in rows:
              kind = row['axis']
              if kind not in ['horse', 'jockey', 'trainer']: raise ValueError('unexpected axis')
              local = db.execute(f"SELECT COUNT(*), MAX(as_of_date) FROM {kind}_elo_snapshots WHERE id LIKE 'v12:%' AND as_of_date >= ?", (os.environ['ELO_SINCE'],)).fetchone()
              if (row['n'], row['latest']) != local: raise ValueError(f'{kind} incomplete: remote={row}, local={local}')
          if len(rows) != 3: raise ValueError('missing axis')
          print('v12 count and latest date match complete replay for all three axes')
          PY
