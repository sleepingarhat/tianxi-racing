name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend_deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Replay test — market-blend odds-key contract
        run: npx tsx scripts/test-market-blend.ts

      - name: Regression test — admin credentials never come from URLs
        run: npx tsx scripts/test-admin-auth.ts

      - name: Regression test — membership entitlements and free tier
        run: npx tsx scripts/test-membership.ts

      - name: Regression test — frozen prediction lock SSOT
        run: npx tsx scripts/test-prediction-lock.ts

      - name: Regression test — lock telemetry storage
        run: npx tsx scripts/test-lock-telemetry.ts

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
