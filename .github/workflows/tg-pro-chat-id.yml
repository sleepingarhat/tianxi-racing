name: TG Pro Chat ID
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: write parser
        run: |
          cat > /tmp/parse_updates.py <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if not d.get("ok"):
              print("getUpdates FAIL", d.get("description")); raise SystemExit
          seen = {}
          for u in d["result"]:
              for k in ("channel_post", "my_chat_member", "message"):
                  m = u.get(k)
                  if not m: continue
                  c = m.get("chat", {})
                  seen[c.get("id")] = (c.get("type"), c.get("title"), c.get("username"))
          for cid, info in seen.items(): print("chat", cid, info)
          if not seen: print("no updates seen")
          PYEOF
      - name: webhook status and recent channel posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          W=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "$W" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',{}); print('webhook url='+(r.get('url') or '(none)'))"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100" > /tmp/u.json
          python3 /tmp/parse_updates.py /tmp/u.json
