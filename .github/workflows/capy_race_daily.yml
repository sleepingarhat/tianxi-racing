name: Capy Race Day — RacingData Results

# Runs RacingData_Scraper.py in --daily mode after each HKJC race meeting to
# backfill the race-result CSVs under data/<year>/results_*.csv.
#
# Schedule: HK 23:30 daily (UTC 15:30). Pre-flight fixture_guard check exits
# cleanly on non-race days to save GHA minutes.

on:
  schedule:
    # HK 23:30 daily = UTC 15:30
    - cron: '30 15 * * *'
    # 後備補跑（2026-10-02）：GitHub 排程常遲幾個鐘；賽日窗口係今日∨昨日（香港），
    # 已收齊會按場號集合自動跳過，所以重跑安全。HK 01:30 / 04:30 / 09:30
    - cron: '30 17 * * *'
    - cron: '30 20 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional explicit date YYYY-MM-DD (comma list) to scrape; blank = today'
        required: false
        default: ''
      force:
        description: 'Bypass fixture_guard (y/n)'
        required: false
        default: 'n'

permissions:
  contents: write

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  race-day:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-flight — fixture guard
        id: guard
        run: |
          set +e
          if [ "${{ github.event.inputs.force }}" = "y" ] || [ -n "${{ github.event.inputs.date }}" ]; then
            echo "skip_check=true — manual override"
            echo "skip_check=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          python fixture_guard.py check-today
          rc=$?
          echo "guard_rc=$rc"
          if [ $rc -eq 10 ]; then
            echo "no_race=true" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Short-circuit — no race today
        if: steps.guard.outputs.no_race == 'true'
        run: |
          echo "::notice::fixture_guard reports no race today, exiting cleanly"

      - name: Setup Chrome
        id: chrome
        if: steps.guard.outputs.no_race != 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Export browser paths
        if: steps.guard.outputs.no_race != 'true'
        run: |
          echo "CHROMIUM_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      - name: Install Python deps
        if: steps.guard.outputs.no_race != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run race day scraper
        if: steps.guard.outputs.no_race != 'true'
        run: |
          # 2026-09-10: Chrome/ChromeDriver read-timeouts (selenium ReadTimeoutError)
          # silently dropped a whole race day (2026-09-09). Retry up to 3 times
          # with a cool-down so a transient browser hang no longer loses results.
          run_scraper() {
            if [ -n "${{ github.event.inputs.date }}" ]; then
              python RacingData_Scraper.py --date "${{ github.event.inputs.date }}"
            else
              python RacingData_Scraper.py --daily
            fi
          }
          for attempt in 1 2 3; do
            echo "::group::race-day scraper attempt $attempt"
            if run_scraper; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::scraper attempt $attempt failed"
            pkill -f chromedriver || true
            pkill -f "chrome" || true
            sleep 30
          done
          echo "::error::race-day scraper failed after 3 attempts"
          exit 1

      # 2026-10-26: schema + heartbeat (adopted from jeffincn poll_ticks /
      # pandera-style CSV guards). Fail closed on truncated dumps; record
      # data/job_ticks so automation_watchdog can dead-man the content path.
      - name: Assert results CSV schema + record job tick
        if: steps.guard.outputs.no_race != 'true'
        run: |
          set -eu
          TODAY=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
          YEAR=$(TZ=Asia/Hong_Kong date +%Y)
          # Prefer explicit --date input when provided (first token).
          DATE_IN="${{ github.event.inputs.date }}"
          if [ -n "$DATE_IN" ]; then
            TODAY=$(echo "$DATE_IN" | cut -d, -f1 | tr -d ' ')
            YEAR=$(echo "$TODAY" | cut -d- -f1)
          fi
          FOUND=0
          ROWS=0
          for kind_glob in "results_${TODAY}.csv" "results_${TODAY}_*.csv"; do
            for f in data/${YEAR}/${kind_glob} data/${TODAY:0:4}/${kind_glob}; do
              [ -f "$f" ] || continue
              FOUND=1
              R=$(python3 -c "import csv; print(sum(1 for _ in csv.DictReader(open('$f',encoding='utf-8-sig'))))")
              ROWS=$((ROWS + R))
              python3 scripts/ci/assert_csv_schema.py --csv "$f" --kind results --min-rows 40 --min-races 1
            done
          done
          for kind_glob in "dividends_${TODAY}.csv" "dividends_${TODAY}_*.csv"; do
            for f in data/${YEAR}/${kind_glob} data/${TODAY:0:4}/${kind_glob}; do
              [ -f "$f" ] || continue
              FOUND=1
              python3 scripts/ci/assert_csv_schema.py --csv "$f" --kind dividends --min-rows 20 --min-races 1 || {
                echo "::warning::dividends schema soft-fail for $f (results remain hard gate)"
              }
            done
          done
          bash scripts/ci/assert_collected_rows.sh "$ROWS" "$TODAY"
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No results CSV found for $TODAY under data/${YEAR}/ after scraper"
            exit 1
          fi
          python3 scripts/ci/job_ticks.py record --job capy_race_daily --status ok --meta date="$TODAY" --meta rows="$ROWS"

      - name: Push results to main
        if: steps.guard.outputs.no_race != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python git_sync.py \
            --message "[data][skip ci] race-day $(date -u +%Y-%m-%dT%H:%MZ) via GHA"
