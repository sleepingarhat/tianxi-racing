name: D1 fill Elo gap 2024-02–2025-02

# Rebuild Elo from 2016 on local sqlite (continuous ratings),
# then INSERT OR REPLACE only the missing as_of_date window into D1.
# Does not DELETE existing rows. Does not change LGB prod weights.

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Gap start (inclusive)'
        default: '2024-02-01'
      to:
        description: 'Gap end (inclusive)'
        default: '2025-02-25'

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Link tianxi-backend → 統一倉 backend/
        working-directory: ${{ github.workspace }}
        run: mv "$GITHUB_WORKSPACE/repo/backend" "$GITHUB_WORKSPACE/tianxi-backend"

      - name: Link hkjc-data → 統一倉根
        working-directory: ${{ github.workspace }}
        run: ln -sfn "$GITHUB_WORKSPACE/repo" "$GITHUB_WORKSPACE/hkjc-data"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tianxi-backend/package-lock.json

      - name: Install backend deps
        working-directory: tianxi-backend
        run: npm ci

      - name: Import results + form + compute Elo from 2016
        working-directory: tianxi-backend
        run: |
          set -euo pipefail
          npx tsx scripts/import-csv.ts --data-dir ../hkjc-data/data --db ./bulk-local.db
          npx tsx scripts/ingest/index.ts form --data-dir=../hkjc-data --db=./bulk-local.db
          npx tsx scripts/elo/compute_v12.ts --db=./bulk-local.db --reset --from=2016-01-01 --run-label=gapfill_20260903

      - name: Export gap snapshots to SQL chunks
        working-directory: tianxi-backend
        env:
          GAP_FROM: ${{ inputs.from }}
          GAP_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          npx tsx scripts/push-delta.ts --db=./bulk-local.db --since="$GAP_FROM" --until="$GAP_TO" --include=elo --elo-version=v12 --out=/tmp/elo_sql > /tmp/elo_manifest.txt

      - name: Push v12 SQL chunks to D1
        working-directory: tianxi-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          n=0
          for f in /tmp/elo_sql/*_elo_snapshots-*.sql; do
            n=$((n+1))
            echo "push $f ($n)"
            npx wrangler d1 execute tianxi-db --remote --file="$f"
          done
          echo "pushed $n files"

      - name: Verify hole filled
        working-directory: tianxi-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute tianxi-db --remote --json --command "SELECT substr(as_of_date,1,7) ym, COUNT(*) n FROM horse_elo_snapshots WHERE id LIKE 'v12:%' AND axis_key='overall' AND as_of_date>='2024-01-01' AND as_of_date<='2025-03-01' GROUP BY ym ORDER BY ym"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elo-gap-fill-manifest
          path: /tmp/elo_manifest.txt
          retention-days: 14
