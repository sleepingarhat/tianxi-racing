name: TG Chat Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: webhook status and recent channel posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          W=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "webhook => $(echo "$W" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result",{}); print("url="+(r.get("url") or "(none)"))')"
          U=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100")
          echo "$U" | python3 -c '
import json,sys
d=json.load(sys.stdin)
if not d.get("ok"): print("getUpdates FAIL", d.get("description")); raise SystemExit
seen={}
for u in d["result"]:
    for k in ("channel_post","my_chat_member","message"):
        m=u.get(k)
        if not m: continue
        c=m.get("chat",{})
        seen[c.get("id")]=(c.get("type"),c.get("title"),c.get("username"))
for cid,info in seen.items(): print("chat", cid, info)
if not seen: print("no updates seen")'
