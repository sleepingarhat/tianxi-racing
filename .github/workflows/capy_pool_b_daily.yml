name: Capy Pool B Daily — Trials + Jockeys

# Pool B lighter scrapers (TrialResults + JockeyData) — runs daily.
# Total wall-clock ~20 minutes. Each scraper is idempotent / skip-existing.

on:
  schedule:
    # HK 02:00 daily = UTC 18:00 previous day
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      skip_scrapers:
        description: 'Comma-separated scrapers to skip (e.g. TrialResults,JockeyData)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  pool-b:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-flight — fixture guard (any race day within ±2 days?)
        id: guard
        run: bash scripts/fixture_guard.sh --window 2 --direction any

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Setup Chrome
        id: chrome
        if: steps.guard.outputs.run == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Export browser paths
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "CHROMIUM_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      - name: Install Python deps
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pool B scrapers
        if: steps.guard.outputs.run == 'true'
        run: |
          SKIP="${{ github.event.inputs.skip_scrapers }}"
          FAILED=0
          for scraper in TrialResults_Scraper.py JockeyData_Scraper.py; do
            short=$(echo "$scraper" | sed 's/_Scraper\.py//')
            if echo ",$SKIP," | grep -q ",$short,"; then
              echo "::group::Skipping $scraper"
              echo "  skipped by dispatch input"
              echo "::endgroup::"
              continue
            fi
            echo "::group::$scraper"
            python "$scraper" || { echo "  $scraper failed — not verified"; FAILED=1; }
            echo "::endgroup::"
          done
          exit "$FAILED"

      - name: Push Pool B data to main
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python git_sync.py \
            --message "[data][skip ci] pool-b $(date -u +%Y-%m-%dT%H:%MZ) via GHA"
