name: Capy Wave8 — fixture lines, results-all, directory, people, same-sire, wind

# Official copies of pages that were still partial on the living map.
# Research and display rows. Not race-settlement rows, not model inputs, and
# not frozen picks. Penetrometer "--" stays blank. WIN/PLA odds are not written.
#
# Schedule (UTC → HKT): 23:40→07:40.

on:
  workflow_dispatch:
    inputs:
      surfaces:
        description: 'fixture,results-all,directory,persons,same-sire,wind'
        required: false
        default: 'fixture,results-all,directory,persons,same-sire,wind'
  schedule:
    - cron: '40 23 * * *'
permissions:
  contents: write
concurrency:
  group: capy-wave8-surfaces
  cancel-in-progress: false
jobs:
  season_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled wave8 surfaces"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  collect:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install parser dependencies
        run: pip install beautifulsoup4==4.14.2

      - name: Test wave8 identity rules
        run: python3 -m unittest discover -s scripts -p test_hkjc_wave8_surfaces.py

      - name: Scrape wave8 official surfaces
        env:
          SURFACES: ${{ github.event.inputs.surfaces || 'fixture,results-all,directory,persons,same-sire,wind' }}
        run: python3 scripts/hkjc_wave8_surfaces.py --root=. --surfaces="$SURFACES"

      - name: Commit projection and append-only manifest
        run: |
          set -eu
          [ -d data/official_wave8 ] || exit 0
          git config user.name 'tianxi-bot'
          git config user.email 'tianxi-bot@users.noreply.github.com'
          git add data/official_wave8
          git diff --cached --quiet && exit 0
          for f in $(git diff --cached --name-only --diff-filter=M); do
            case "$f" in
              data/official_wave8/manifest.jsonl)
                if git diff --cached "$f" | grep -qE '^-[^-]'; then echo 'append-only log rewrite refused'; exit 1; fi
                ;;
              data/official_wave8/*.csv) ;;
              *) echo "unexpected official_wave8 change: $f"; exit 1 ;;
            esac
          done
          if [ -n "$(git diff --cached --name-only --diff-filter=D)" ]; then echo 'wave8 surface deletion refused'; exit 1; fi
          git commit -m '[data][skip ci] official HKJC wave8 surfaces'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent data conflict; original evidence preserved, refusing overwrite'
              exit 1
            fi
          done
          echo 'Push failed after three safe retries'
          exit 1

      - name: Require Cloudflare token on a schedule
        if: github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CF_API_TOKEN missing; scheduled wave8 ingest cannot write D1'
            exit 1
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Ensure D1 tables one statement at a time
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CF_API_TOKEN missing; leaving the CSV projection unsent'
            exit 0
          fi
          python3 - << 'PY'
          from pathlib import Path
          text = Path('src/db/migrations/20261124_wave8_surfaces.sql').read_text(encoding='utf-8')
          text = '\n'.join(line for line in text.split('\n') if not line.lstrip().startswith('--'))
          parts = [part.strip() for part in text.split(';') if part.strip()]
          out = Path('/tmp/wave8_schema')
          out.mkdir(exist_ok=True)
          for index, part in enumerate(parts):
              (out / f'{index:02d}.sql').write_text(part + ';\n', encoding='utf-8')
          print(f'schema statements={len(parts)}')
          PY
          for f in $(ls /tmp/wave8_schema/*.sql | sort); do
            echo "--> $f"
            bash "$GITHUB_WORKSPACE/scripts/d1-execute-file.sh" "$f"
          done

      - name: Upsert wave8 surfaces into D1
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CF_API_TOKEN missing; leaving the CSV projection unsent'
            exit 0
          fi
          python3 ../scripts/hkjc_wave8_surfaces.py --root=.. --emit-sql /tmp/official_wave8.sql
          python3 - << 'PY'
          from pathlib import Path
          text = Path('/tmp/official_wave8.sql').read_text(encoding='utf-8')
          text = '\n'.join(line for line in text.split('\n') if not line.lstrip().startswith('--'))
          parts = [part.strip() for part in text.split(';\n') if part.strip() and not part.strip().startswith('--')]
          out = Path('/tmp/official_wave8_chunks')
          out.mkdir(exist_ok=True)
          size = 250
          for index in range(0, len(parts), size):
              chunk = ';\n'.join(parts[index:index + size]) + ';\n'
              (out / f'{index:05d}.sql').write_text(chunk, encoding='utf-8')
          print(f'chunks={(len(parts) + size - 1) // size if parts else 0} statements={len(parts)}')
          PY
          if ! ls /tmp/official_wave8_chunks/*.sql >/dev/null 2>&1; then
            echo 'no wave8 statements to apply'
            exit 0
          fi
          for f in $(ls /tmp/official_wave8_chunks/*.sql | sort); do
            echo "--> $f"
            bash "$GITHUB_WORKSPACE/scripts/d1-execute-file.sh" "$f"
          done
