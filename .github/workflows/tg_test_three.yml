name: TG Test — three locked cards

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD'
        required: true
        default: '2026-07-12'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fonts + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow
      - name: Render and send 3 PDFs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHANNEL: ${{ vars.TG_CHANNEL || '@tianxi_racing_pro,@tianxi_racing' }}
        run: |
          python3 tools/tg_test_three.py ${{ inputs.date }}
