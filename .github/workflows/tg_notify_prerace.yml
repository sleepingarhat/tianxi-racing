name: TG Notify — Pre-race (free pick)

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 HKT race-day morning
  workflow_dispatch:
    inputs:
      force:
        description: 'Post even if the upcoming meeting is not today'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      date:
        description: 'YYYY-MM-DD historical test (uses hit-rate predicted top4, first race only)'
        required: false

permissions:
  contents: read

jobs:
  season_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  notify:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fonts + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow
      - name: Post pre-race day digest
        if: ${{ inputs.date == '' || inputs.date == null }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 tools/tg_notify.py prerace ${{ inputs.force == 'true' && '--force' || '' }}
      - name: Post per-race prediction PDFs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 tools/tg_race_cards.py prerace-races --date ${{ inputs.date }}
          else
            python3 tools/tg_race_cards.py prerace-races ${{ inputs.force == 'true' && '--force' || '' }}
          fi
