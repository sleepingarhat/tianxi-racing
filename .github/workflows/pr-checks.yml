name: PR checks (backend)

# 只做檢查：typecheck + 回歸測試。冇任何部署步驟、唔讀任何 secrets。
# 部署只喺 backend_deploy.yml（push 到 main／手動）發生。
on:
  pull_request:
    paths: ['backend/**', 'tools/tx_reader_auth.py', 'tools/tg_notify.py', 'tools/tg_race_cards.py', 'tools/test_tg_reader_auth.py', '.github/workflows/pr-checks.yml', '.github/workflows/backend_deploy.yml', '.github/workflows/tg_notify_*.yml']

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: oven-sh/setup-bun@v2

      - name: Regression test — immutable freeze recovery and REAL values
        run: bun scripts/test-freeze-recovery.ts

      - name: Regression test — freeze-ledger isolation, snapshot and cache
        run: bun scripts/test-freeze-ledger-perf.ts

      - name: Regression test — D1 sync of sectionals + barrier trials (push-delta e2e, FK ON, re-run safe)
        run: npx tsx scripts/test-push-delta-sync.ts

      - name: Regression test — public data-stats (D1 counts stored daily, never per request)
        run: bun scripts/test-data-stats.ts

      - name: Regression test — lock-tick meeting window compares instants (HKT vs UTC)
        run: bun scripts/test-lock-window.ts

      - name: Replay test — market-blend odds-key contract
        run: npx tsx scripts/test-market-blend.ts

      - name: Regression test — admin credentials never come from URLs
        run: npx tsx scripts/test-admin-auth.ts

      - name: Regression test — legacy Whop membership retired (410/301) and free tier
        run: npx tsx scripts/test-membership.ts

      - name: Regression test — 愛駒追蹤 watch events feed
        run: npx tsx scripts/test-watch-events.ts

      - name: Regression test — frozen prediction lock SSOT
        run: npx tsx scripts/test-prediction-lock.ts

      - name: Regression test — lock telemetry storage
        run: npx tsx scripts/test-lock-telemetry.ts

      - name: Regression tests — restored v12 formulas and replay
        run: |
          npx tsx scripts/test-elo-v12.ts
          npx tsx scripts/test-elo-v12-integration.ts
          npx tsx scripts/test-elo-asof.ts

      - name: Regression test — odds 20-minute freshness boundary
        run: bun scripts/test-odds-freshness.ts

      - name: Regression test — CORS allowlist
        run: npx tsx scripts/test-cors-policy.ts

      - name: Regression test — security guards (JWT, Pro gate, rate limits, chat, lounge)
        run: bun scripts/test-security-guards.ts

      - name: Regression test — TG reader credential + ANON_FULL_CARD_MODE
        run: npx tsx scripts/test-tg-reader.ts

      - name: Regression test — site reader credential + ANON_HITRATE_MODE
        run: npx tsx scripts/test-hit-rate-access.ts

      - name: Regression test — TG scripts send X-TG-Reader-Token (Python, no network)
        run: python3 -m unittest discover -s ../tools -p test_tg_reader_auth.py

      - name: Extra tests (PR only) — public today-picks, running style, horse career, lab suite
        run: |
          npx tsx scripts/test-public-today-picks.ts
          npx tsx scripts/test-running-style.ts
          npx tsx scripts/test-horse-career-stats.ts
          npx tsx scripts/test-horse-career-api.ts
          npx tsx scripts/test-lab-h2h.ts
          npx tsx scripts/test-lab-h2h-auth.ts
          npx tsx scripts/test-notify-events.ts
          npx tsx scripts/test-lab-pace.ts
          npx tsx scripts/test-lab-pace-auth.ts
          npx tsx scripts/test-lab-backtest.ts
          npx tsx scripts/test-lab-backtest-auth.ts
          npx tsx scripts/test-lab-going.ts
          npx tsx scripts/test-lab-going-auth.ts
