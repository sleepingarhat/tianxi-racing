name: Capy Racing Changes — official 更易事項

# Refreshes the HKJC changes board on race days and the day before.
# HTML snapshots stay append-only. changes.csv is the latest-board projection.
# Matching runners are written back to entries_upcoming; name mismatches stay raw.
#
# Schedule (UTC → HKT): 00:15→08:15, 04:15→12:15, 08:15→16:15, 10:15→18:15, 12:15→20:15.
# Non-race days skip when neither today nor tomorrow (HK) is on the fixture calendar.
# Pending / unparsed clauses fail the job after the snapshot is kept.

on:
  schedule:
    - cron: '15 0,4,8,10,12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional page date YYYY-MM-DD; blank accepts the date printed on the page'
        required: false
        default: ''
      venue:
        description: 'Optional ST or HV'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  season_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled changes refresh"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  changes:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test changes parser
        run: python3 -m unittest scripts/test_racing_changes.py

      - name: Pre-flight — today or tomorrow HK
        id: guard
        if: github.event_name == 'schedule'
        run: |
          set +e
          python fixture_guard.py check-today
          today=$?
          NEXT=$(TZ=Asia/Hong_Kong date -d tomorrow +%Y-%m-%d)
          python fixture_guard.py check-date "$NEXT"
          tom=$?
          set -e
          echo "today=$today tomorrow=$tom ($NEXT)"
          if [ "$today" -eq 0 ] || [ "$tom" -eq 0 ]; then
            echo "no_race=false" >> "$GITHUB_OUTPUT"
          else
            echo "no_race=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Short-circuit — no race today or tomorrow
        if: github.event_name == 'schedule' && steps.guard.outputs.no_race == 'true'
        run: echo "::notice::fixture_guard reports no race today or tomorrow, exiting cleanly"

      - name: Fetch changes board
        id: scrape
        if: github.event_name != 'schedule' || steps.guard.outputs.no_race != 'true'
        continue-on-error: true
        run: |
          python3 scripts/RacingChanges_Scraper.py --root=. \
            --date="${{ github.event.inputs.date }}" \
            --venue="${{ github.event.inputs.venue }}" \
            --sql-out=/tmp/racing-changes.sql

      - name: Commit snapshots and projection
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.no_race != 'true')
        run: |
          set -eu
          git config user.name 'tianxi-bot'
          git config user.email 'tianxi-bot@users.noreply.github.com'
          git add data/racing-changes
          git diff --cached --quiet && exit 0
          for f in $(git diff --cached --name-only --diff-filter=M); do
            case "$f" in
              data/racing-changes/manifest.json)
                if git diff --cached "$f" | grep -qE '^-[^-]'; then
                  echo 'manifest rewrite refused'
                  exit 1
                fi
                ;;
              data/racing-changes/changes.csv) ;;
              *) echo "original snapshot modification refused: $f"; exit 1 ;;
            esac
          done
          [ -z "$(git diff --cached --name-only --diff-filter=D)" ] || { echo 'snapshot delete refused'; exit 1; }
          git commit -m "[data][skip ci] racing changes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main

      - name: Fail closed on an unparsed board
        if: steps.scrape.outcome == 'failure'
        run: exit 1

      - name: Push structured changes to D1
        if: steps.scrape.outcome == 'success'
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          npm install -g wrangler@4
          wrangler d1 execute tianxi-db --remote --file=src/db/migrations/20261027_racing_changes.sql
          if [ -s /tmp/racing-changes.sql ]; then
            wrangler d1 execute tianxi-db --remote --file=/tmp/racing-changes.sql
          else
            echo "no structured change rows"
          fi
