name: Capy Results — scrape HKJC race results to D1

"on":
  workflow_dispatch:
    inputs:
      date:
        description: 'Race date (YYYY-MM-DD)'
        required: true
      venue:
        description: 'Venue code (ST / HV)'
        required: true
        default: 'ST'
      max_races:
        description: 'Max races to attempt'
        required: false
        default: '14'

jobs:
  scrape-results:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scrape HKJC race results
        run: |
          npx tsx scripts/scrape-results.ts \
            --date=${{ inputs.date }} \
            --venue=${{ inputs.venue }} \
            --max-races=${{ inputs.max_races }} \
            --out=/tmp/results.sql
          echo "--- SQL preview ---"
          head -5 /tmp/results.sql
          wc -l /tmp/results.sql

      - name: Ensure void-race columns on D1
        run: |
          set -eu
          INFO=$(npx wrangler d1 execute tianxi-db --remote --command="PRAGMA table_info(races)" --json)
          ensure_col() {
            local col="$1"
            local ddl="$2"
            if printf '%s' "$INFO" | grep -q "\"name\": \"${col}\""; then
              echo "exists: races.${col}"
            else
              npx wrangler d1 execute tianxi-db --remote --command="$ddl"
              INFO=$(npx wrangler d1 execute tianxi-db --remote --command="PRAGMA table_info(races)" --json)
            fi
          }
          ensure_col status "ALTER TABLE races ADD COLUMN status TEXT"
          ensure_col official_note "ALTER TABLE races ADD COLUMN official_note TEXT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Push SQL to D1
        run: |
          npx wrangler d1 execute tianxi-db --remote --file=/tmp/results.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
