name: Capy Pool A — Horse Profiles + Trackwork + Injury

# Matrix architecture (2026-04-25): splits the 3 scrapers across parallel
# jobs, each with their own 6h GHA-hosted budget. HorseData + HorseTrackwork
# are sharded across 4 partitions via CRC32(horse_no) so per-shard wallclock
# drops below 2h.
#
# Replaces the single-job sequential design that consistently hit GHA's
# hard 6-hour ubuntu-latest cap (the previous `timeout-minutes: 720` was
# silently truncated to 360 by GitHub's policy).
#
# Jobs graph:
#   guard -> horse-data[0..3] -+-> horse-trackwork[0..3] -+-> push
#                              +-> horse-injury          -+
#
# Cutover status: FULL CUTOVER as of 2026-04-24. Pool A is the sole owner
# of horse profile / trackwork / injury scraping. Replit VM confirmed
# stopped since 2026-04-23.

on:
  schedule:
    - cron: '0 20 * * *'      # daily HK 04:00
  workflow_dispatch:
    inputs:
      skip_scrapers:
        description: 'Skip list (HorseData,HorseTrackwork,HorseInjury)'
        required: false
        default: ''
      force:
        description: 'Bypass fixture guard (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  # Hand-off below dispatches the D1 Pool A sync once fresh CSVs are on main.
  actions: write

env:
  TOTAL_SHARDS: 4

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  guard:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: g
        name: Fixture gate (always-on for trackwork)
        run: |
          # Trackwork happens at training stables daily, regardless of races.
          # Previous --window 1 --direction past caused 4-day data lag whenever
          # the past 24h had no race day. Always run.
          echo "always-on for daily trackwork pipeline"
          echo "run=true" >> $GITHUB_OUTPUT

  horse-data:
    needs: guard
    if: needs.guard.outputs.run == 'true' && !contains(github.event.inputs.skip_scrapers, 'HorseData')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Export browser paths
        run: |
          echo "CHROMIUM_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HorseData shard ${{ matrix.shard }}
        run: |
          python HorseData_Scraper.py \
            --shard ${{ matrix.shard }} \
            --total-shards ${{ env.TOTAL_SHARDS }} \
            || echo "HorseData shard ${{ matrix.shard }} exited non-zero — uploading partial"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-a-horsedata-shard-${{ matrix.shard }}
          path: |
            horses/profiles/horse_profiles.csv
            horses/form_records/
            failed_horses.log
          if-no-files-found: warn
          retention-days: 7

  horse-trackwork:
    needs: horse-data
    if: always() && needs.horse-data.result != 'cancelled' && needs.horse-data.result != 'skipped' && !contains(github.event.inputs.skip_scrapers, 'HorseTrackwork')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download horse-data artefacts (per-shard subdirs · avoid race)
        uses: actions/download-artifact@v4
        with:
          pattern: pool-a-horsedata-shard-*
          path: /tmp/hd-artifacts
          # merge-multiple defaults to false — each shard in own subdir, no concurrent-write race

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Export browser paths
        run: |
          echo "CHROMIUM_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=${{ steps.chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Merge horse-data artefacts into working tree
        run: python scripts/merge_pool_a_artifacts.py /tmp/hd-artifacts

      - name: Run HorseTrackwork shard ${{ matrix.shard }}
        run: |
          python HorseTrackwork_Scraper.py \
            --shard ${{ matrix.shard }} \
            --total-shards ${{ env.TOTAL_SHARDS }} \
            || echo "HorseTrackwork shard ${{ matrix.shard }} exited non-zero — uploading partial"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-a-trackwork-shard-${{ matrix.shard }}
          path: |
            horses/trackwork/
            failed_trackwork.log
          if-no-files-found: warn
          retention-days: 7

  horse-injury:
    needs: horse-data
    if: always() && needs.horse-data.result != 'cancelled' && needs.horse-data.result != 'skipped' && !contains(github.event.inputs.skip_scrapers, 'HorseInjury')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download horse-data artefacts (per-shard subdirs · avoid race)
        uses: actions/download-artifact@v4
        with:
          pattern: pool-a-horsedata-shard-*
          path: /tmp/hd-artifacts
          # merge-multiple defaults to false — each shard in own subdir, no concurrent-write race

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Merge horse-data artefacts into working tree
        run: python scripts/merge_pool_a_artifacts.py /tmp/hd-artifacts

      - name: Run HorseInjury (requests-based, single job)
        run: python HorseInjury_Scraper.py || echo "HorseInjury exited non-zero — uploading partial"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-a-injury
          path: |
            horses/injury/
            failed_injury.log
          if-no-files-found: warn
          retention-days: 7

  push:
    needs: [horse-data, horse-trackwork, horse-injury]
    if: always() && (needs.horse-data.result == 'success' || needs.horse-trackwork.result == 'success' || needs.horse-injury.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install merge deps
        run: pip install pandas

      - name: Merge artefacts into working tree
        run: python scripts/merge_pool_a_artifacts.py /tmp/artifacts

      - name: Push merged data to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python git_sync.py --message "pool-a $(date -u +%Y-%m-%dT%H:%MZ) via GHA matrix"

      # The workflow_run chain into capy_d1_sync_pool_a has never fired, and its cron
      # fallback can run before this push lands (2026-11-09: sync 00:58 UTC, push 02:07
      # UTC), leaving the previous meeting's form records out of D1 for a whole day.
      # Dispatch the sync explicitly after the push succeeds.
      - name: Hand off to D1 Pool A sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run capy_d1_sync_pool_a.yml --ref main -R "${{ github.repository }}"
