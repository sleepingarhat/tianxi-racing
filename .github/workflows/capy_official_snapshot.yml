name: Capy Official Snapshot — append-only T-90 and post-race evidence

# Point-in-time copies of official HKJC surfaces. Not the prediction lock,
# not the A-line, and not a Worker crawl. Live Wave tables stay latest-state.
# Freeze time is entries_upcoming MIN(post_time) minus 90 minutes.
#
# GitHub does not deliver a */10 cron here (5 runs in ~34h after the workflow
# landed; the 2026-11-25 17:10–18:40 HKT window had zero runs). This workflow
# waits until lockAt when a run starts early, and writes kind=freeze immediately
# when a run starts inside the window. It does not backfill after first post.

on:
  workflow_dispatch:
    inputs:
      date: { description: 'Race date YYYY-MM-DD (blank = in-window meetings)', required: false, default: '' }
      venue: { description: 'ST or HV (blank = every in-window venue)', required: false, default: '' }
      kind: { description: 'freeze, post_race, card_status, pre_freeze_safety, or blank', required: false, default: '' }
  workflow_run:
    workflows:
      - "Capy Racecard — enrich entries_upcoming via hkjc-api"
      - "Capy Race Day — RacingData Results"
      - "Capy Track Conditions — research evidence only"
      - "Capy Odds — live snapshot (hkjc-api GraphQL)"
    types: [completed]
    branches: [main]
  schedule:
    # Best-effort arms. A dropped slot creates no run; workflow_run above is the catch-up.
    - cron: '20 22 * * *'   # 06:20 HKT, about five hours before a Sha Tin 11:15 lock
    - cron: '20 3 * * *'    # 11:20 HKT, inside an 11:15–12:45 window when this slot is delivered
    - cron: '10 4 * * *'    # 12:10 HKT, second chance inside that window
    - cron: '10 8 * * *'    # 16:10 HKT, about one hour before a Happy Valley 17:10 lock
    - cron: '20 9 * * *'    # 17:20 HKT, inside a 17:10–18:40 window when this slot is delivered

permissions:
  contents: write

concurrency:
  group: capy-official-snapshot
  cancel-in-progress: false

jobs:
  season_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled official snapshots"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  snapshot:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Test official snapshot rules
        run: python3 -m unittest discover -s scripts -p test_official_snapshot_rules.py

      - name: Wait until the freeze window, or catch up inside it
        id: plan
        env:
          OFFICIAL_SNAPSHOT_TRIGGER: ${{ github.event_name }}
          OFFICIAL_SNAPSHOT_SOURCE: ${{ github.event.workflow_run.name }}
          OFFICIAL_SNAPSHOT_SOURCE_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/official_snapshot_arm.py --root=.

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install parser dependencies
        run: pip install beautifulsoup4==4.14.2 pypdf==7.0.1

      - name: Install racecard dump dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Test read-only snapshot routes
        if: steps.plan.outputs.fast_capture != 'true'
        working-directory: backend
        run: npx tsx scripts/test-official-visible.ts

      - name: Capture snapshots
        id: capture
        env:
          DATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.date || '' }}
          VENUE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.venue || '' }}
          KIND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.kind || '' }}
          OFFICIAL_SNAPSHOT_TRIGGER: ${{ github.event_name }}
          OFFICIAL_SNAPSHOT_SOURCE: ${{ github.event.workflow_run.name }}
          OFFICIAL_SNAPSHOT_ACTION: ${{ steps.plan.outputs.action }}
          OFFICIAL_SNAPSHOT_PHASE: ${{ steps.plan.outputs.phase }}
          OFFICIAL_SNAPSHOT_REASON: ${{ steps.plan.outputs.reason }}
          OFFICIAL_SNAPSHOT_MEETING: ${{ steps.plan.outputs.meeting }}
          OFFICIAL_SNAPSHOT_LOCK_AT: ${{ steps.plan.outputs.lock_at }}
          OFFICIAL_SNAPSHOT_FIRST_POST_AT: ${{ steps.plan.outputs.first_post_at }}
          OFFICIAL_SNAPSHOT_WAKE_AT: ${{ steps.plan.outputs.wake_at }}
          OFFICIAL_SNAPSHOT_NOW: ${{ steps.plan.outputs.now }}
          OFFICIAL_SNAPSHOT_SLEPT_SECONDS: ${{ steps.plan.outputs.slept_seconds }}
          OFFICIAL_SNAPSHOT_MARGIN_SECONDS: ${{ steps.plan.outputs.margin_seconds }}
          OFFICIAL_SNAPSHOT_CATCH_UP: ${{ steps.plan.outputs.catch_up }}
          OFFICIAL_SNAPSHOT_NOT_BACKFILLED: ${{ steps.plan.outputs.not_backfilled }}
        run: |
          set +e
          echo "[official-snapshot] capture trigger=${OFFICIAL_SNAPSHOT_TRIGGER} source=${OFFICIAL_SNAPSHOT_SOURCE} meeting=${OFFICIAL_SNAPSHOT_MEETING} phase=${OFFICIAL_SNAPSHOT_PHASE} action=${OFFICIAL_SNAPSHOT_ACTION} reason=${OFFICIAL_SNAPSHOT_REASON} lockAt=${OFFICIAL_SNAPSHOT_LOCK_AT} firstPostAt=${OFFICIAL_SNAPSHOT_FIRST_POST_AT} slept_seconds=${OFFICIAL_SNAPSHOT_SLEPT_SECONDS} margin_seconds=${OFFICIAL_SNAPSHOT_MARGIN_SECONDS} catch_up=${OFFICIAL_SNAPSHOT_CATCH_UP} not_backfilled=${OFFICIAL_SNAPSHOT_NOT_BACKFILLED}"
          ARGS="--root=."
          if [ -n "$DATE" ]; then ARGS="$ARGS --date=$DATE"; fi
          if [ -n "$VENUE" ]; then ARGS="$ARGS --venue=$VENUE"; fi
          if [ -n "$KIND" ]; then ARGS="$ARGS --kind=$KIND"; fi
          python3 scripts/official_snapshot_tick.py $ARGS
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "tick exit=$code"
          exit 0

      - name: Commit append-only snapshot files
        run: |
          set -eu
          git config user.name 'tianxi-bot'
          git config user.email 'tianxi-bot@users.noreply.github.com'
          git checkout -- backend/package.json backend/package-lock.json 2>/dev/null || true
          if [ ! -d data/official_snapshots ]; then echo 'no snapshot directory'; exit 0; fi
          git add data/official_snapshots
          git diff --cached --quiet && { echo 'no new snapshot'; exit 0; }
          if git diff --cached --name-only | grep -q '_staging/'; then echo 'staging files are not evidence'; exit 1; fi
          if git diff --cached --name-status | grep -vE '^(A|M)\s+data/official_snapshots/'; then echo 'unexpected change'; exit 1; fi
          if [ -n "$(git diff --cached --name-only --diff-filter=D)" ]; then echo 'snapshot deletion refused'; exit 1; fi
          for f in $(git diff --cached --name-only --diff-filter=M); do
            case "$f" in
              data/official_snapshots/manifest.jsonl|data/official_snapshots/gaps.jsonl|data/official_snapshots/poll.jsonl|data/official_snapshots/ticks.jsonl)
                if git diff --cached "$f" | grep -qE '^-[^-]'; then echo "append-only log rewrite refused: $f"; exit 1; fi
                ;;
              *) echo "modified existing snapshot: $f"; exit 1 ;;
            esac
          done
          detail=$(python3 - << 'PY'
          import json
          from pathlib import Path
          path = Path('data/official_snapshots/_staging/summary.json')
          if not path.exists():
              print('tick')
          else:
              rows = json.loads(path.read_text(encoding='utf-8')).get('actions', [])
              bits = []
              for row in rows:
                  if row.get('status') != 'written':
                      continue
                  meeting = str(row.get('meeting', '')).replace('|', ' ')
                  bits.append(f"{meeting} {row.get('kind', '')}".strip())
              print(' '.join(bits) or 'tick')
          PY
          )
          git commit -m "[data][skip ci] official snapshot ${detail}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo 'Concurrent data conflict; original evidence preserved, refusing overwrite'
              exit 1
            fi
          done
          echo 'Push failed after three safe retries'
          exit 1

      - name: Require Cloudflare token on a schedule
        if: github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CF_API_TOKEN missing; scheduled official snapshot cannot write D1'
            exit 1
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Apply snapshot schema and append-only rows
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CF_API_TOKEN missing; leaving the snapshot files unsent'
            exit 0
          fi
          python3 - << 'PY'
          from pathlib import Path
          text = Path('src/db/migrations/20261125_official_snapshots.sql').read_text(encoding='utf-8')
          parts = []
          buf = []
          depth = 0
          for line in text.splitlines():
              if line.lstrip().startswith('--'):
                  continue
              buf.append(line)
              stripped = line.strip().upper()
              if stripped == 'BEGIN':
                  depth += 1
              elif stripped.startswith('END'):
                  depth = max(0, depth - 1)
              if depth == 0 and line.rstrip().endswith(';'):
                  statement = '\n'.join(buf).strip()
                  if statement:
                      parts.append(statement if statement.endswith(';') else statement + ';')
                  buf = []
          out = Path('/tmp/official_snapshot_schema')
          out.mkdir(exist_ok=True)
          for index, part in enumerate(parts):
              (out / f'{index:02d}.sql').write_text(part + '\n', encoding='utf-8')
          print(f'schema statements={len(parts)}')
          PY
          for f in $(ls /tmp/official_snapshot_schema/*.sql | sort); do
            echo "--> $f"
            bash "$GITHUB_WORKSPACE/scripts/d1-execute-file.sh" "$f"
          done
          if ! ls "$GITHUB_WORKSPACE"/data/official_snapshots/_staging/d1/*.sql >/dev/null 2>&1; then
            echo 'no snapshot statements to apply'
            exit 0
          fi
          for f in $(ls "$GITHUB_WORKSPACE"/data/official_snapshots/_staging/d1/*.sql | sort); do
            echo "--> $f"
            bash "$GITHUB_WORKSPACE/scripts/d1-execute-file.sh" "$f"
          done

      - name: Fail the job when the freeze window was incomplete
        if: steps.capture.outputs.exit != '0'
        run: |
          echo "official snapshot tick exited ${{ steps.capture.outputs.exit }} after writing gaps"
          exit 1
