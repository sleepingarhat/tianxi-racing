account_id = "653a13852ac331972d14432741113f6f"
name = "tianxi-backend"
main = "src/index.ts"
compatibility_date = "2025-04-14"
compatibility_flags = ["nodejs_compat"]
usage_model = "unbound"
workers_dev = true

[vars]
ENVIRONMENT = "production"
AI_API_URL = "https://api.x.ai/v1/chat/completions"
AI_MODEL = "grok-4.20-reasoning"
# 每次 AI 呼叫 max_tokens 上限（硬上限 3000，程式內再夾一次）
AI_MAX_TOKENS = "1500"
# Supabase 專案網址（公開）：/api/chat、lounge 發帖同 Pro 權限用嚟核實 JWT（JWKS）
SUPABASE_URL = "https://mnztxtekjjvktutanblg.supabase.co"
# Pro JWT 直接入口權限：預設 off（同現況一樣）。要開請喺呢度改做 "on" 再部署，
# 並先用 `wrangler secret put SUPABASE_PUBLISHABLE_KEY` 設定公開 publishable key。
PRO_ENTITLEMENT_MODE = "off"
# 已完賽 today-picks 對匿名請求嘅範圍：預設 legacy（同現況一樣，全部場次）。
# 改做 "restricted" 之前，必須先 `wrangler secret put TG_READER_TOKEN`，並喺 GitHub Actions 設定同一個值嘅
# secret TG_READER_TOKEN，確認 TG 賽前／賽後 workflow 正常。restricted：匿名只得第一場；全部場次只派畀
# TG 讀取憑證（X-TG-Reader-Token）、已登入用戶或 Pro。回滾：改返 "legacy" 再部署。
ANON_FULL_CARD_MODE = "restricted"
# 已完賽 /api/analyze/hit-rate 對匿名請求嘅範圍：預設 legacy（同現況一樣，每場凍結四揀＋對帳）。
# 改做 "restricted" 之前：TG_READER_TOKEN 要已經生效（TG 賽後），`wrangler secret put SITE_READER_TOKEN` 同
# Lovable secret SITE_READER_TOKEN 要設定同一個值，而且網站伺服器函數已經帶 X-Tianxi-Site-Token 上線。
# restricted：匿名只得第一場四揀，其餘場次只有賽果同彙總；hit-rate-rollup 本身已經只係彙總，唔受影響。
# 回滾：改返 "legacy" 再部署。
ANON_HITRATE_MODE = "restricted"
# LEGACY_CRON_SECRET_FALLBACK 唔放喺呢度：輪換完成後用 `wrangler secret put LEGACY_CRON_SECRET_FALLBACK`（值 off）
# TIMESFM_API_URL set later when RunPod endpoint ready

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tianxi-db"
database_id = "aad1636e-869a-43f5-aa95-4a19e3aa5517"

# KV for caching odds and sessions
# [[kv_namespaces]]
# binding = "CACHE"
# id = "placeholder"

# Custom domain: Pages owns the public site; Worker must own /api,/admin,/pro.
# Exact /admin (no trailing slash) was previously falling through to Pages 404.
[[routes]]
pattern = "tianxi.racing/api/*"
zone_name = "tianxi.racing"

[[routes]]
pattern = "tianxi.racing/admin"
zone_name = "tianxi.racing"

[[routes]]
pattern = "tianxi.racing/admin/*"
zone_name = "tianxi.racing"

[[routes]]
pattern = "tianxi.racing/pro"
zone_name = "tianxi.racing"

[[routes]]
pattern = "tianxi.racing/pro/*"
zone_name = "tianxi.racing"

[[routes]]
pattern = "www.tianxi.racing/api/*"
zone_name = "tianxi.racing"

[[routes]]
pattern = "www.tianxi.racing/admin"
zone_name = "tianxi.racing"

[[routes]]
pattern = "www.tianxi.racing/admin/*"
zone_name = "tianxi.racing"

[[routes]]
pattern = "www.tianxi.racing/pro"
zone_name = "tianxi.racing"

[[routes]]
pattern = "www.tianxi.racing/pro/*"
zone_name = "tianxi.racing"

  [triggers]
  crons = [
    "0 19 * * *",  # 03:00 HKT daily — refresh past-meeting hit-rate cache
    "0 22 * * *",  # 06:00 HKT daily — pre-build race-day report (post-trackwork sync)
    "0 3 * * *",   # 11:00 HKT daily — refresh report ~1.5h before ST first race
    "0 4 * * *",   # 12:00 HKT daily — second pre-race refresh
    "0 10 * * *",  # 18:00 HKT daily — refresh report 1h before HV first race
    "*/5 * * * *", # every 5 min — T−1.5h lock tick only (light; no heavy jobs)
  ]
