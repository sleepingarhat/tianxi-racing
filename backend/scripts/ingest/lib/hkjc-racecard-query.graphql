
      query racing($date: String, $venueCode: String) {
          raceMeetings(date: $date, venueCode: $venueCode)
          {
            status
            currentNumberOfRace
            totalInvestment
            races {
              no
              status
              runners {
                id
                no
                standbyNo
                status
                name_ch
                name_en
                horse {
                  id
                  code
                }
                color
                barrierDrawNumber
                handicapWeight
                currentWeight
                currentRating
                internationalRating
                gearInfo
                racingColorFileName
                allowance
                trainerPreference
                last6run
                saddleClothNo
                trumpCard
                priority
                finalPosition
                deadHeat
                winOdds
                jockey {
                  code
                  name_en
                  name_ch
                }
                trainer {
                  code
                  name_en
                  name_ch
                }
              }
            }
          }
      }
  